# CI — the test suite on working branches and main. The package build
# lives in release.yml (tags only): a job with a false `if` condition still
# shows up as "skipped" in the PR checks UI, so keeping it here would add
# noise to every PR. What needs the physical machine (live-daemon
# integration, plasmawindowed smoke, screenshots) is not covered by CI.
#
# Triggers scoped to avoid duplicate runs: pull_request for working
# branches, push for main (post-merge verification). Tags are handled by
# release.yml alone.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      - name: install dependencies
        run: |
          pacman -Syu --noconfirm archlinux-keyring
          pacman -Syu --noconfirm git \
              qt6-base qt6-declarative \
              kirigami libplasma kdeclarative plasma5support \
              python-hidapi python-yaml mypy
      - uses: actions/checkout@v7
      - name: test suite (unit, structural, QML, lint, typing)
        env:
          SKIP_INTEGRATION: "1"   # needs the physical pad
        run: ./tests/run.sh
