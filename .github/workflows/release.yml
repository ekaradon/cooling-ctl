# Release automation — versions are driven by the conventional commits
# that land on main; the maintainer stays the human gate.
#
#   prepare: after any merge except a release one, computes the next
#            version from the commits since the last tag
#            (tools/prepare-release.py; fix -> patch, feat and breaking ->
#            minor on the 0.x line; ci/docs/chore/test never release).
#            With something to release it inserts the CHANGELOG section,
#            bumps metadata.json and PKGBUILD, and opens a
#            chore(release): vX.Y.Z PR for the maintainer to merge.
#   package: merging that PR (head commit "chore(release): v...") tags
#            vX.Y.Z, publishes the GitHub Release (notes from the
#            CHANGELOG section, the built package attached to it) and
#            uploads the workflow artifact.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags for the range scan
      - id: rel
        name: next release?
        run: |
          v=$(python3 tools/prepare-release.py --check)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "next release: $v"
      - name: open the release PR
        if: steps.rel.outputs.version != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.rel.outputs.version }}"
          git config user.name "cooling-ctl release bot"
          git config user.email "actions@github.com"
          git checkout -b "release/v$V"
          python3 tools/prepare-release.py > notes.md
          git add CHANGELOG.md PKGBUILD plasmoid/org.coolingctl/metadata.json
          git commit -m "chore(release): v$V"
          git push origin "release/v$V"
          gh pr create --base main --head "release/v$V" \
            --title "chore(release): v$V" \
            --body-file notes.md

  package:
    # quoted: the value contains ": " and YAML would not parse the file
    # otherwise (the whole workflow then fails at load time, zero jobs)
    if: "startsWith(github.event.head_commit.message, 'chore(release): v')"
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      - name: install dependencies
        # the PKGBUILD depends=() — makepkg resolves them at build time
        # (S50 in test_structure.py pins this against the PKGBUILD)
        run: |
          pacman -Syu --noconfirm archlinux-keyring
          pacman -Syu --noconfirm git base-devel github-cli \
              kirigami libplasma plasma-workspace plasma5support \
              kdeclarative python python-hidapi
      - uses: actions/checkout@v4
      - name: tag the release
        run: |
          # the checkout's owner uid differs from the job user in the
          # container: without this, git refuses every command on the
          # repo ("dubious ownership") — the v0.7.0 run passed this
          # step while tagging and pushing nothing
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          V=$(grep -o '"Version": "[0-9.]*"' plasmoid/org.coolingctl/metadata.json \
              | grep -o '[0-9.]*')
          git tag "v$V" || true
          git push origin "v$V"
      - name: makepkg (PKGBUILD as published — git source, no shortcut)
        run: |
          useradd -m builder
          cp -r "$GITHUB_WORKSPACE" /tmp/build
          chown -R builder:builder /tmp/build
          cd /tmp/build
          runuser -u builder -- makepkg -f
      - name: publish the GitHub release (notes + package asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep -o '"Version": "[0-9.]*"' plasmoid/org.coolingctl/metadata.json \
              | grep -o '[0-9.]*')
          # notes: the CHANGELOG section this release inserted
          awk -v ver="$V" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > "notes-v$V.md"
          gh release view "v$V" >/dev/null 2>&1 || \
              gh release create "v$V" --verify-tag --title "v$V" \
                  --notes-file "notes-v$V.md"
          gh release upload "v$V" /tmp/build/*.pkg.tar.zst --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: /tmp/build/*.pkg.tar.zst
          if-no-files-found: error
