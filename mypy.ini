# Static typing for the daemon. Level: every def fully annotated, explicit
# Optional, no returning Any from json payloads unchecked. The plasmoid QML
# and the shell helper are out of scope (qmllint/shellcheck territory).
[mypy]
files = daemon/coolingctld.py
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
strict_equality = True

[mypy-hid]
# hidapi ships no type stubs
ignore_missing_imports = True
